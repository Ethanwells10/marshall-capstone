{% extends "base.html" %}
{% block title %}Notes - Market Monitor{% endblock %}

{% block content %}
<div id="pageLoader" class="spinner-page">
    <div class="spinner-border text-success" role="status"><span class="visually-hidden">Loading...</span></div>
</div>

<div id="pageContent" style="display:none;" class="fade-in">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0"><i class="bi bi-journal-text text-success me-2"></i>All Notes</h4>
        <small class="text-muted" id="noteCount"></small>
    </div>
    <div id="notesContainer"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadAllNotes() {
    const user = await checkAuth();
    if (!user) { window.location.href = "/login"; return; }

    const resp = await apiFetch("/api/notes");
    const data = resp ? await resp.json() : { notes: [] };
    const container = document.getElementById("notesContainer");

    document.getElementById("noteCount").textContent = data.notes.length + " note" + (data.notes.length !== 1 ? "s" : "");

    if (data.notes.length === 0) {
        container.innerHTML = emptyState("bi-journal", "No notes yet", 'Visit a stock page to add research notes. <a href="/dashboard" class="text-success">Go to Dashboard</a>');
    } else {
        // Group by ticker
        const grouped = {};
        data.notes.forEach(n => {
            if (!grouped[n.ticker_symbol]) grouped[n.ticker_symbol] = [];
            grouped[n.ticker_symbol].push(n);
        });

        container.innerHTML = Object.entries(grouped).map(([symbol, notes]) => `
            <div class="mb-4 fade-in">
                <h6 class="mb-3">
                    <a href="/stock/${symbol}" class="text-success text-decoration-none ticker-badge">${symbol}</a>
                    <span class="badge bg-secondary ms-2">${notes.length}</span>
                </h6>
                ${notes.map(n => `
                    <div class="card mb-2" id="note-${n.id}">
                        <div class="card-body py-3 d-flex justify-content-between align-items-start gap-3">
                            <div class="flex-grow-1">
                                <p class="mb-1 text-light">${n.note_text}</p>
                                <small class="text-muted"><i class="bi bi-clock me-1"></i>${timeAgo(n.created_at) || "just now"}</small>
                            </div>
                            <div class="d-flex gap-1 flex-shrink-0">
                                <button class="btn btn-outline-secondary btn-sm" onclick="startEditNote(${n.id}, '${n.note_text.replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/\n/g,"\\n")}')"><i class="bi bi-pencil"></i></button>
                                <button class="btn btn-outline-danger btn-sm" onclick="deleteNote(${n.id})"><i class="bi bi-trash"></i></button>
                            </div>
                        </div>
                    </div>
                `).join("")}
            </div>
        `).join("");
    }

    document.getElementById("pageLoader").style.display = "none";
    document.getElementById("pageContent").style.display = "";
}

function startEditNote(id, text) {
    const card = document.getElementById(`note-${id}`);
    card.querySelector('.card-body').innerHTML = `
        <textarea class="form-control mb-2" id="edit-note-${id}" rows="2">${text}</textarea>
        <div class="d-flex gap-2">
            <button class="btn btn-success btn-sm" onclick="saveEditNote(${id})"><i class="bi bi-check-lg me-1"></i>Save</button>
            <button class="btn btn-outline-secondary btn-sm" onclick="loadAllNotes()">Cancel</button>
        </div>`;
    document.getElementById(`edit-note-${id}`).focus();
}

async function saveEditNote(id) {
    const text = document.getElementById(`edit-note-${id}`).value.trim();
    if (!text) return;
    const resp = await apiFetch(`/api/notes/${id}`, { method: "PUT", body: JSON.stringify({ note_text: text }) });
    if (resp && resp.ok) {
        showToast("Note updated", "success");
        loadAllNotes();
    } else {
        showToast("Failed to update note", "error");
    }
}

async function deleteNote(id) {
    await apiFetch(`/api/notes/${id}`, { method: "DELETE" });
    showToast("Note deleted", "info");
    loadAllNotes();
}

loadAllNotes();
</script>
{% endblock %}
