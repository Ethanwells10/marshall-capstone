{% extends "base.html" %}
{% block title %}Watchlists - Market Monitor{% endblock %}

{% block content %}
<div id="pageLoader" class="spinner-page">
    <div class="spinner-border text-success" role="status"><span class="visually-hidden">Loading...</span></div>
</div>

<div id="pageContent" style="display:none;" class="fade-in">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0"><i class="bi bi-eye text-success me-2"></i>Watchlists</h4>
        <button class="btn btn-success btn-sm" onclick="showCreateModal()"><i class="bi bi-plus-lg me-1"></i>New Watchlist</button>
    </div>

    <div class="row g-3" id="watchlistCards"></div>

    <!-- Watchlist detail panel -->
    <div id="watchlistDetail" class="mt-4" style="display:none;">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="bi bi-eye text-success me-2"></i><span id="detailName"></span></h5>
                <div>
                    <button class="btn btn-outline-success btn-sm me-1" onclick="showAddTickerModal()"><i class="bi bi-plus-lg me-1"></i>Add Stock</button>
                    <button class="btn btn-outline-danger btn-sm" onclick="deleteWatchlist()"><i class="bi bi-trash"></i></button>
                </div>
            </div>
            <div class="card-body">
                <div id="detailItems"></div>
            </div>
        </div>
    </div>
</div>

<!-- Create Watchlist Modal -->
<div class="modal fade" id="createModal" tabindex="-1">
    <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">New Watchlist</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="text" class="form-control" id="newWatchlistName" placeholder="e.g. Tech Stocks" autofocus>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-success btn-sm" onclick="createWatchlist()">Create</button>
            </div>
        </div>
    </div>
</div>

<!-- Add Ticker Modal -->
<div class="modal fade" id="addTickerModal" tabindex="-1">
    <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Stock</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="text" class="form-control" id="addTickerSymbol" placeholder="e.g. AAPL" style="text-transform:uppercase;" autofocus>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-success btn-sm" onclick="addTicker()">Add</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let selectedWatchlistId = null;
let createModalInstance, addTickerModalInstance;

async function loadWatchlists() {
    const user = await checkAuth();
    if (!user) { window.location.href = "/login"; return; }

    const resp = await apiFetch("/api/watchlists");
    const data = resp ? await resp.json() : { watchlists: [] };
    const container = document.getElementById("watchlistCards");

    if (data.watchlists.length === 0) {
        container.innerHTML = emptyState("bi-eye-slash", "No watchlists yet", "Create a watchlist to start tracking your favorite stocks.");
    } else {
        container.innerHTML = data.watchlists.map(wl => `
            <div class="col-md-4 fade-in">
                <div class="card watchlist-item ${selectedWatchlistId === wl.id ? 'active' : ''}" onclick="selectWatchlist(${wl.id}, '${wl.name.replace(/'/g, "\\'")}')">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <h6 class="mb-0"><i class="bi bi-folder2 text-success me-2"></i>${wl.name}</h6>
                            <span class="badge bg-success rounded-pill">${wl.item_count}</span>
                        </div>
                        <small class="text-muted mt-2 d-block">${wl.item_count} stock${wl.item_count !== 1 ? 's' : ''} tracked</small>
                    </div>
                </div>
            </div>
        `).join("");
    }

    document.getElementById("pageLoader").style.display = "none";
    document.getElementById("pageContent").style.display = "";
}

async function selectWatchlist(id, name) {
    selectedWatchlistId = id;
    document.getElementById("detailName").textContent = name;
    document.getElementById("watchlistDetail").style.display = "";
    document.getElementById("detailItems").innerHTML = '<div class="text-center py-3"><div class="spinner-border spinner-border-sm text-success"></div></div>';

    // Update active state
    document.querySelectorAll(".watchlist-item").forEach(el => el.classList.remove("active"));
    event.currentTarget.closest(".watchlist-item").classList.add("active");

    const resp = await apiFetch(`/api/watchlists/${id}/items`);
    const data = resp ? await resp.json() : { items: [] };

    if (data.items.length === 0) {
        document.getElementById("detailItems").innerHTML = emptyState("bi-inbox", "Empty watchlist", "Add stocks to this watchlist to start tracking them.");
    } else {
        document.getElementById("detailItems").innerHTML = `
            <div class="table-responsive fade-in">
                <table class="table table-dark table-hover align-middle mb-0">
                    <thead><tr><th>Symbol</th><th>Name</th><th>Sector</th><th></th></tr></thead>
                    <tbody>
                        ${data.items.map(item => `
                            <tr>
                                <td><a href="/stock/${item.symbol}" class="text-success fw-bold text-decoration-none ticker-badge">${item.symbol}</a></td>
                                <td class="text-light">${item.name || item.symbol}</td>
                                <td><span class="text-muted small">${item.sector || '--'}</span></td>
                                <td class="text-end"><button class="btn btn-outline-danger btn-sm py-0 px-2" onclick="removeTicker('${item.symbol}', event)"><i class="bi bi-x-lg"></i></button></td>
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
            </div>`;
    }
}

function showCreateModal() {
    document.getElementById("newWatchlistName").value = "";
    createModalInstance = new bootstrap.Modal(document.getElementById("createModal"));
    createModalInstance.show();
    setTimeout(() => document.getElementById("newWatchlistName").focus(), 300);
}

async function createWatchlist() {
    const name = document.getElementById("newWatchlistName").value.trim();
    if (!name) return;
    const resp = await apiFetch("/api/watchlists", { method: "POST", body: JSON.stringify({ name }) });
    createModalInstance.hide();
    if (resp && resp.ok) {
        showToast(`Watchlist "${name}" created`, "success");
        loadWatchlists();
    } else {
        const data = resp ? await resp.json() : {};
        showToast(data.error || "Failed to create watchlist", "error");
    }
}

async function deleteWatchlist() {
    if (!selectedWatchlistId || !confirm("Delete this watchlist? This cannot be undone.")) return;
    const name = document.getElementById("detailName").textContent;
    await apiFetch(`/api/watchlists/${selectedWatchlistId}`, { method: "DELETE" });
    selectedWatchlistId = null;
    document.getElementById("watchlistDetail").style.display = "none";
    showToast(`Watchlist "${name}" deleted`, "info");
    loadWatchlists();
}

function showAddTickerModal() {
    document.getElementById("addTickerSymbol").value = "";
    addTickerModalInstance = new bootstrap.Modal(document.getElementById("addTickerModal"));
    addTickerModalInstance.show();
    setTimeout(() => document.getElementById("addTickerSymbol").focus(), 300);
}

async function addTicker() {
    const symbol = document.getElementById("addTickerSymbol").value.trim().toUpperCase();
    if (!symbol || !selectedWatchlistId) return;
    const resp = await apiFetch(`/api/watchlists/${selectedWatchlistId}/items`, { method: "POST", body: JSON.stringify({ symbol }) });
    addTickerModalInstance.hide();
    if (resp && resp.ok) {
        showToast(`${symbol} added to watchlist`, "success");
        selectWatchlist(selectedWatchlistId, document.getElementById("detailName").textContent);
        loadWatchlists();
    } else {
        const data = resp ? await resp.json() : {};
        showToast(data.error || "Failed to add stock", "error");
    }
}

async function removeTicker(symbol, e) {
    e.stopPropagation();
    if (!selectedWatchlistId) return;
    await apiFetch(`/api/watchlists/${selectedWatchlistId}/items/${symbol}`, { method: "DELETE" });
    showToast(`${symbol} removed`, "info");
    selectWatchlist(selectedWatchlistId, document.getElementById("detailName").textContent);
    loadWatchlists();
}

// Handle enter key in modals
document.getElementById("newWatchlistName").addEventListener("keydown", e => { if (e.key === "Enter") createWatchlist(); });
document.getElementById("addTickerSymbol").addEventListener("keydown", e => { if (e.key === "Enter") addTicker(); });

loadWatchlists();
</script>
{% endblock %}
