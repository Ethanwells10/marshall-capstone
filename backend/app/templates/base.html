<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Market Monitor{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">
                <i class="bi bi-graph-up-arrow text-success me-2"></i>Market Monitor
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav me-auto" id="navLinks" style="display:none;">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard" data-page="dashboard"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/browse" data-page="browse"><i class="bi bi-collection me-1"></i>Stocks</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/watchlists" data-page="watchlists"><i class="bi bi-eye me-1"></i>Watchlists</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/portfolio" data-page="portfolio"><i class="bi bi-wallet2 me-1"></i>Portfolio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/notes" data-page="notes"><i class="bi bi-journal-text me-1"></i>Notes</a>
                    </li>
                </ul>
                <form class="d-flex me-3" id="searchForm" style="display:none !important;">
                    <div class="input-group input-group-sm">
                        <input type="text" class="form-control" id="tickerSearch" placeholder="Search ticker..." style="max-width:160px;">
                        <button class="btn btn-outline-success btn-sm" type="submit"><i class="bi bi-search"></i></button>
                    </div>
                </form>
                <div id="userNav" style="display:none;" class="d-flex align-items-center gap-2">
                    <a href="/profile" class="btn btn-outline-secondary btn-sm rounded-circle p-0 d-flex align-items-center justify-content-center" style="width:32px;height:32px;" title="Profile">
                        <i class="bi bi-person"></i>
                    </a>
                    <button class="btn btn-outline-light btn-sm" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-muted py-3 border-top mt-auto">
        <small>Market Monitor &copy; 2026 | Data from Alpha Vantage, NewsAPI, CoinGecko</small>
    </footer>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
