{% extends "base.html" %}
{% block title %}Login - Market Monitor{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow">
            <div class="card-body p-4">
                <h3 class="text-center mb-4"><i class="bi bi-graph-up-arrow text-success"></i> Market Monitor</h3>

                <ul class="nav nav-tabs mb-3" id="authTabs">
                    <li class="nav-item">
                        <a class="nav-link active" href="#" onclick="showTab('login')">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="showTab('register')">Register</a>
                    </li>
                </ul>

                <div id="alertBox" class="alert d-none"></div>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="loginEmail" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="loginPassword" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Login</button>
                </form>

                <form id="registerForm" style="display:none;" onsubmit="handleRegister(event)">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="regEmail" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="regPassword" minlength="6" required>
                        <div class="form-text">At least 6 characters</div>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Create Account</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function showTab(tab) {
    document.querySelectorAll("#authTabs .nav-link").forEach(el => el.classList.remove("active"));
    if (tab === "login") {
        event.target.classList.add("active");
        document.getElementById("loginForm").style.display = "";
        document.getElementById("registerForm").style.display = "none";
    } else {
        event.target.classList.add("active");
        document.getElementById("loginForm").style.display = "none";
        document.getElementById("registerForm").style.display = "";
    }
    document.getElementById("alertBox").classList.add("d-none");
}

function showAlert(msg, type) {
    const box = document.getElementById("alertBox");
    box.className = `alert alert-${type}`;
    box.textContent = msg;
}

async function handleLogin(e) {
    e.preventDefault();
    const resp = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({
            email: document.getElementById("loginEmail").value,
            password: document.getElementById("loginPassword").value
        })
    });
    const data = await resp.json();
    if (resp.ok) {
        window.location.href = "/dashboard";
    } else {
        showAlert(data.error || "Login failed", "danger");
    }
}

async function handleRegister(e) {
    e.preventDefault();
    const resp = await fetch("/api/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({
            email: document.getElementById("regEmail").value,
            password: document.getElementById("regPassword").value
        })
    });
    const data = await resp.json();
    if (resp.ok) {
        window.location.href = "/dashboard";
    } else {
        showAlert(data.error || "Registration failed", "danger");
    }
}

// If already logged in, redirect to dashboard
checkAuth().then(user => { if (user) window.location.href = "/dashboard"; });
</script>
{% endblock %}
