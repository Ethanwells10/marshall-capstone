{% extends "base.html" %}
{% block title %}Dashboard - Market Monitor{% endblock %}

{% block content %}
<div id="pageLoader" class="spinner-page">
    <div class="spinner-border text-success" role="status"><span class="visually-hidden">Loading...</span></div>
</div>

<div id="pageContent" style="display:none;" class="fade-in">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0"><i class="bi bi-speedometer2 text-success me-2"></i>Dashboard</h4>
        <small class="text-muted" id="lastUpdated"></small>
    </div>

    <!-- Market Indices -->
    <div class="mb-4">
        <h6 class="text-muted text-uppercase small mb-3"><i class="bi bi-bar-chart me-1"></i>Market Indices (ETFs)</h6>
        <div class="row g-3" id="indicesRow"></div>
    </div>

    <!-- Crypto -->
    <div class="mb-4">
        <h6 class="text-muted text-uppercase small mb-3"><i class="bi bi-currency-bitcoin me-1"></i>Cryptocurrency</h6>
        <div class="row g-3" id="cryptoRow"></div>
    </div>

    <!-- Watchlists Preview -->
    <div>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="text-muted text-uppercase small mb-0"><i class="bi bi-eye me-1"></i>Your Watchlists</h6>
            <a href="/watchlists" class="btn btn-outline-success btn-sm"><i class="bi bi-arrow-right me-1"></i>View All</a>
        </div>
        <div id="watchlistsPreview"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadDashboard() {
    const user = await checkAuth();
    if (!user) { window.location.href = "/login"; return; }

    // Show skeletons while loading
    document.getElementById("indicesRow").innerHTML = skeletonCards(3);
    document.getElementById("cryptoRow").innerHTML = skeletonCards(3);
    document.getElementById("pageLoader").style.display = "none";
    document.getElementById("pageContent").style.display = "";

    const [marketResp, wlResp] = await Promise.all([
        apiFetch("/api/market/overview"),
        apiFetch("/api/watchlists")
    ]);

    // Indices
    const market = marketResp ? await marketResp.json() : { indices: [], crypto: [] };
    const indicesRow = document.getElementById("indicesRow");
    if (market.indices.length === 0 || market.indices.every(i => !i.price)) {
        indicesRow.innerHTML = emptyState("bi-bar-chart", "No market data", "Live market data will appear here when API keys are configured on the server.");
    } else {
        indicesRow.innerHTML = market.indices.map(idx => `
            <div class="col-md-4 fade-in">
                <div class="card stat-card h-100">
                    <div class="card-body text-center py-4">
                        <div class="stat-label mb-2">${idx.name}</div>
                        <span class="ticker-badge text-success">${idx.symbol}</span>
                        <div class="stat-value mt-2">${formatPrice(idx.price)}</div>
                        <div class="mt-2">${formatChange(idx.change_percent)}</div>
                    </div>
                </div>
            </div>
        `).join("");
    }

    // Crypto
    const cryptoRow = document.getElementById("cryptoRow");
    if (market.crypto.length === 0 || market.crypto.every(c => !c.price)) {
        cryptoRow.innerHTML = emptyState("bi-currency-bitcoin", "No crypto data", "Crypto prices from CoinGecko will appear here.");
    } else {
        cryptoRow.innerHTML = market.crypto.map(c => `
            <div class="col-md-4 fade-in">
                <div class="card stat-card h-100">
                    <div class="card-body text-center py-4">
                        <div class="stat-label mb-2">${c.name}</div>
                        <span class="ticker-badge text-success">${c.symbol}</span>
                        <div class="stat-value mt-2">${formatPrice(c.price)}</div>
                        <div class="mt-2">${formatChange(c.change_percent_24h)}</div>
                    </div>
                </div>
            </div>
        `).join("");
    }

    // Watchlists
    const wlData = wlResp ? await wlResp.json() : { watchlists: [] };
    const wlDiv = document.getElementById("watchlistsPreview");
    if (wlData.watchlists.length === 0) {
        wlDiv.innerHTML = emptyState("bi-eye-slash", "No watchlists yet", 'Create your first watchlist to start tracking stocks. <a href="/watchlists" class="text-success">Get started</a>');
    } else {
        wlDiv.innerHTML = '<div class="row g-3">' + wlData.watchlists.map(wl => `
            <div class="col-md-4 fade-in">
                <a href="/watchlists" class="text-decoration-none">
                    <div class="card watchlist-item h-100">
                        <div class="card-body d-flex justify-content-between align-items-center">
                            <div>
                                <i class="bi bi-eye text-success me-2"></i>
                                <span class="text-light fw-semibold">${wl.name}</span>
                            </div>
                            <span class="badge bg-success rounded-pill">${wl.item_count}</span>
                        </div>
                    </div>
                </a>
            </div>
        `).join("") + '</div>';
    }

    document.getElementById("lastUpdated").textContent = "Updated " + new Date().toLocaleTimeString();
}

loadDashboard();
</script>
{% endblock %}
