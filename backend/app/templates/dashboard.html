{% extends "base.html" %}
{% block title %}Dashboard - Market Monitor{% endblock %}

{% block content %}
<div id="pageLoader" class="spinner-page">
    <div class="spinner-border text-success" role="status"><span class="visually-hidden">Loading...</span></div>
</div>

<div id="pageContent" style="display:none;">
    <h4 class="mb-4">Market Overview</h4>

    <!-- Market Indices -->
    <div class="row g-3 mb-4">
        <div class="col-12"><h6 class="text-muted text-uppercase small">Major Indices (ETFs)</h6></div>
        <div id="indicesRow" class="row g-3"></div>
    </div>

    <!-- Crypto -->
    <div class="row g-3 mb-4">
        <div class="col-12"><h6 class="text-muted text-uppercase small">Cryptocurrency</h6></div>
        <div id="cryptoRow" class="row g-3"></div>
    </div>

    <!-- Quick Access: Watchlists -->
    <div class="row g-3">
        <div class="col-12 d-flex justify-content-between align-items-center">
            <h6 class="text-muted text-uppercase small mb-0">Your Watchlists</h6>
            <a href="/watchlists" class="btn btn-outline-success btn-sm">View All</a>
        </div>
        <div id="watchlistsPreview" class="col-12"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadDashboard() {
    const user = await checkAuth();
    if (!user) { window.location.href = "/login"; return; }

    // Load market data and watchlists in parallel
    const [marketResp, wlResp] = await Promise.all([
        apiFetch("/api/market/overview"),
        apiFetch("/api/watchlists")
    ]);

    // Indices
    const market = marketResp ? await marketResp.json() : { indices: [], crypto: [] };
    const indicesRow = document.getElementById("indicesRow");
    if (market.indices.length === 0) {
        indicesRow.innerHTML = '<div class="col"><p class="text-muted">No market data available. API keys may not be configured.</p></div>';
    } else {
        indicesRow.innerHTML = market.indices.map(idx => `
            <div class="col-md-4">
                <div class="card stat-card h-100">
                    <div class="card-body text-center">
                        <h6 class="text-muted mb-1">${idx.name}</h6>
                        <span class="ticker-badge text-light">${idx.symbol}</span>
                        <h4 class="mt-2 mb-1">${formatPrice(idx.price)}</h4>
                        ${formatChange(idx.change_percent)}
                    </div>
                </div>
            </div>
        `).join("");
    }

    // Crypto
    const cryptoRow = document.getElementById("cryptoRow");
    cryptoRow.innerHTML = market.crypto.map(c => `
        <div class="col-md-4">
            <div class="card stat-card h-100">
                <div class="card-body text-center">
                    <h6 class="text-muted mb-1">${c.name}</h6>
                    <span class="ticker-badge text-light">${c.symbol}</span>
                    <h4 class="mt-2 mb-1">${formatPrice(c.price)}</h4>
                    ${formatChange(c.change_percent_24h)}
                </div>
            </div>
        </div>
    `).join("");

    // Watchlists
    const wlData = wlResp ? await wlResp.json() : { watchlists: [] };
    const wlDiv = document.getElementById("watchlistsPreview");
    if (wlData.watchlists.length === 0) {
        wlDiv.innerHTML = '<p class="text-muted">No watchlists yet. <a href="/watchlists">Create one</a>.</p>';
    } else {
        wlDiv.innerHTML = '<div class="list-group">' + wlData.watchlists.map(wl => `
            <a href="/watchlists" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center" style="background-color:#22262c;border-color:#2d3238;">
                <span><i class="bi bi-eye me-2 text-success"></i>${wl.name}</span>
                <span class="badge bg-success rounded-pill">${wl.item_count} stocks</span>
            </a>
        `).join("") + '</div>';
    }

    document.getElementById("pageLoader").style.display = "none";
    document.getElementById("pageContent").style.display = "";
}

loadDashboard();
</script>
{% endblock %}
