{% extends "base.html" %}
{% block title %}Search "{{ query }}" - Market Monitor{% endblock %}

{% block content %}
<div id="pageLoader" class="spinner-page">
    <div class="spinner-border text-success" role="status"><span class="visually-hidden">Loading...</span></div>
</div>

<div id="pageContent" style="display:none;" class="fade-in">
    <div class="mb-4">
        <h4 class="mb-1">Search Results</h4>
        <p class="text-muted mb-0">Showing results for "<span class="text-light">{{ query }}</span>"</p>
    </div>

    <div id="resultsContainer"></div>

    <!-- Direct lookup -->
    <div class="mt-4 p-3 rounded" style="background-color:#1a1f2a;" id="directLookup">
        <p class="mb-2 text-muted small">Don't see what you're looking for?</p>
        <a href="/stock/{{ query }}" class="btn btn-outline-success btn-sm">
            <i class="bi bi-search me-1"></i>Look up "{{ query }}" directly
        </a>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const QUERY = "{{ query }}";

async function loadSearch() {
    const user = await checkAuth();
    if (!user) { window.location.href = "/login"; return; }

    const resp = await apiFetch(`/api/stocks/search?q=${encodeURIComponent(QUERY)}`);
    const data = resp ? await resp.json() : { results: [] };
    const container = document.getElementById("resultsContainer");

    if (data.results.length === 0) {
        container.innerHTML = emptyState("bi-search", "No matches found", `No tickers matching "${QUERY}" in the database. Try looking it up directly.`);
    } else {
        // If exact match, redirect directly
        if (data.results.length === 1 && data.results[0].symbol === QUERY) {
            window.location.href = "/stock/" + QUERY;
            return;
        }

        container.innerHTML = `
            <div class="table-responsive fade-in">
                <table class="table table-dark table-hover align-middle">
                    <thead><tr><th>Symbol</th><th>Name</th><th>Exchange</th><th>Sector</th><th></th></tr></thead>
                    <tbody>
                        ${data.results.map(r => `
                            <tr>
                                <td><a href="/stock/${r.symbol}" class="text-success fw-bold text-decoration-none ticker-badge">${r.symbol}</a></td>
                                <td class="text-light">${r.name || r.symbol}</td>
                                <td><span class="text-muted">${r.exchange || '--'}</span></td>
                                <td><span class="text-muted">${r.sector || '--'}</span></td>
                                <td class="text-end"><a href="/stock/${r.symbol}" class="btn btn-outline-success btn-sm">View</a></td>
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
            </div>
        `;
        document.getElementById("directLookup").style.display = "none";
    }

    document.getElementById("pageLoader").style.display = "none";
    document.getElementById("pageContent").style.display = "";
}

loadSearch();
</script>
{% endblock %}
