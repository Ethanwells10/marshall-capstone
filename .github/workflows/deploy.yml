name: Deploy to Lightsail

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

    - name: Install MySQL and setup database
      run: |
        ssh ubuntu@${{ secrets.SERVER_IP }} 'bash -s' << 'REMOTE_SCRIPT'
          set -e

          # Install MySQL if not present
          if ! dpkg -l | grep -q mysql-server; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mysql-server
          fi

          # Initialize MySQL data directory if needed
          if [ ! -d /var/lib/mysql/mysql ]; then
            sudo mysqld --initialize-insecure --user=mysql
          fi

          # Ensure MySQL is running
          sudo systemctl enable mysql
          sudo systemctl start mysql || sudo systemctl restart mysql

          # Wait for MySQL to be ready
          for i in 1 2 3 4 5; do
            if sudo mysqladmin ping --silent 2>/dev/null; then
              break
            fi
            echo "Waiting for MySQL to start..."
            sleep 3
          done

          # Create database and user
          sudo mysql -e "CREATE DATABASE IF NOT EXISTS market_monitor CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          sudo mysql -e "CREATE USER IF NOT EXISTS 'market_user'@'localhost' IDENTIFIED BY 'market_pass';"
          sudo mysql -e "GRANT ALL PRIVILEGES ON market_monitor.* TO 'market_user'@'localhost';"
          sudo mysql -e "FLUSH PRIVILEGES;"

          echo "MySQL setup complete."
        REMOTE_SCRIPT

    - name: Deploy backend
      run: |
        ssh ubuntu@${{ secrets.SERVER_IP }} "mkdir -p ~/market-monitor/backend"
        scp -r backend/ ubuntu@${{ secrets.SERVER_IP }}:~/market-monitor/
        ssh ubuntu@${{ secrets.SERVER_IP }} "cd ~/market-monitor/backend && python3 -m venv venv && source venv/bin/activate && pip install -r requirements.txt"

    - name: Setup and restart service
      run: |
        ssh ubuntu@${{ secrets.SERVER_IP }} "sudo tee /etc/systemd/system/market-monitor.service > /dev/null << 'UNIT'
        [Unit]
        Description=Market Monitor Flask App
        After=network.target mysql.service

        [Service]
        User=ubuntu
        WorkingDirectory=/home/ubuntu/market-monitor/backend
        Environment=MYSQL_HOST=localhost
        Environment=MYSQL_USER=market_user
        Environment=MYSQL_PASSWORD=market_pass
        Environment=MYSQL_DATABASE=market_monitor
        ExecStart=/home/ubuntu/market-monitor/backend/venv/bin/gunicorn --bind 127.0.0.1:5000 'app:create_app()'
        Restart=always

        [Install]
        WantedBy=multi-user.target
        UNIT"
        ssh ubuntu@${{ secrets.SERVER_IP }} "sudo systemctl daemon-reload && sudo systemctl enable market-monitor && sudo systemctl restart market-monitor"

    - name: Verify deployment
      run: |
        sleep 5
        ssh ubuntu@${{ secrets.SERVER_IP }} "curl -f http://127.0.0.1:5000/api/health" || exit 1
        echo "Deployment successful!"
