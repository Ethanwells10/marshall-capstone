name: Deploy to Lightsail

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Build frontend
      run: |
        cd frontend
        npm ci
        npm run build

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build backend (cross-compile for Linux)
      run: |
        cd backend
        GOOS=linux GOARCH=amd64 go build -o backend-linux .

    - name: Setup SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

    - name: Deploy frontend
      run: |
        ssh ubuntu@${{ secrets.SERVER_IP }} "mkdir -p /tmp/frontend-deploy"
        scp -r frontend/dist/* ubuntu@${{ secrets.SERVER_IP }}:/tmp/frontend-deploy/
        ssh ubuntu@${{ secrets.SERVER_IP }} "sudo rm -rf /var/www/hello-frontend/* && sudo cp -r /tmp/frontend-deploy/* /var/www/hello-frontend/ && rm -rf /tmp/frontend-deploy"

    - name: Deploy backend
      run: |
        ssh ubuntu@${{ secrets.SERVER_IP }} "sudo systemctl stop marshall-backend"
        scp backend/backend-linux ubuntu@${{ secrets.SERVER_IP }}:~/marshall-capstone/backend/backend
        ssh ubuntu@${{ secrets.SERVER_IP }} "chmod +x ~/marshall-capstone/backend/backend && sudo systemctl start marshall-backend"

    - name: Verify deployment
      run: |
        sleep 5
        curl -f https://${{ secrets.SERVER_IP }}/health || curl -f https://marshallcapew.xyz/health || exit 1
        echo "Deployment successful!"
